[package]
name = "com"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "com"
path = "src/main.rs"

[dependencies]
# gpui-ce (the community edition of Zed's GPUI), imported as `gpui`. Its default features are
# for the desktop (every image codec, Linux and macOS font backends): the web build leaves them
# off, and a native build (below) turns them back on.
gpui = { git = "https://github.com/gpui-ce/gpui-ce", rev = "43dacc568497c615c55a1ea0f77ab381c0d9865b", package = "gpui-ce", default-features = false }
gpui_platform = { git = "https://github.com/gpui-ce/gpui-ce", rev = "43dacc568497c615c55a1ea0f77ab381c0d9865b", package = "gpui_ce_platform" }
gpui_wgpu = { git = "https://github.com/gpui-ce/gpui-ce", rev = "43dacc568497c615c55a1ea0f77ab381c0d9865b", package = "gpui_ce_wgpu", features = ["custom-gpu"] }
gpui_fonts = { git = "https://github.com/gpui-ce/gpui-ce", rev = "43dacc568497c615c55a1ea0f77ab381c0d9865b", package = "gpui-ce-fonts" }
wgpu = "29.0.3"
bytemuck = { version = "1", features = ["derive"] }
swash = "0.2"
web-time = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde_yaml = "0.9"
futures = "0.3"
form_urlencoded = "1"
# the same image crate gpui decodes with: frames for images drawn in-app (the terrazzo banner)
# the formats the site serves: its images are WebP (and JPEG/PNG from elsewhere), GIFs animate
image = { version = "0.25", default-features = false, features = ["webp", "jpeg", "png", "gif"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
# a desktop build: gpui-ce with everything it ships
gpui = { git = "https://github.com/gpui-ce/gpui-ce", rev = "43dacc568497c615c55a1ea0f77ab381c0d9865b", package = "gpui-ce", default-features = true }

[target.'cfg(target_family = "wasm")'.dependencies]
web-sys = { version = "0.3", features = ["console", "Window", "Location", "History", "Document", "HtmlDocument", "Navigator", "EventTarget", "Storage", "MediaQueryList", "Worker", "WorkerOptions", "WorkerType", "MessageEvent", "Event", "Element", "Node", "HtmlElement", "HtmlMediaElement", "HtmlVideoElement", "ClipboardEvent", "DataTransfer"] }
wasm-bindgen = "0.2"
js-sys = "0.3"

# The wasm ships to phones and must fit a Workers asset (25 MiB before wasm-opt): size first.
[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
debug = false
strip = true
panic = "abort"

# Parley with its complex-script segmenters off: gpui asks for `complex-scripts`, which bakes
# ICU's Thai/Khmer/Burmese/CJK dictionaries into the wasm. The site is English.
[patch.crates-io]
parley = { path = "vendor/parley" }
# WebGPU only on the web (shims/wgpu explains); desktop builds are unchanged
wgpu = { path = "shims/wgpu" }
# no SVG renderer on the web (shims/usvg explains); desktop builds are unchanged
usvg = { path = "shims/usvg" }
resvg = { path = "shims/resvg" }

[dev-dependencies]
# gpui's test window, for the module tests that need a real layout pass
gpui = { git = "https://github.com/gpui-ce/gpui-ce", rev = "43dacc568497c615c55a1ea0f77ab381c0d9865b", package = "gpui-ce", features = ["test-support"] }
