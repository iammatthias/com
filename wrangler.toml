name = "com"
main = "@astrojs/cloudflare/entrypoints/server"
compatibility_date = "2024-09-23"
# nodejs_compat_populate_process_env: makes the deployed Worker populate
# process.env from its bindings (vars + secrets). Without it, astro:env's
# getSecret() resolves locally (wrangler dev eagerly fills the
# cloudflare:workers env) but returns undefined in the deployed Worker,
# so CONTENT_READ_KEY / FEED_READ_KEY come back empty in prod → Farfield
# 401 → empty content. See withastro/astro#16553.
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]

# Preserve runtime secrets/vars set in the Cloudflare dashboard. Workers
# Builds deploys with `wrangler deploy`, which by DEFAULT deletes any
# bindings not declared here — that was silently wiping CONTENT_READ_KEY /
# FEED_READ_KEY on every deploy, leaving prod unable to read Farfield.
keep_vars = true

# Workers Logs — real request logs (dashboard: Workers → com →
# Observability). Client-side analytics never see AI agents and other
# non-JS readers; this records every invocation, so agent traffic on
# the markdown twins / llms.txt is actually visible.
[observability]
enabled = true

# Global, durable cache for cid-keyed immutable data: blob /meta JSON
# (imm:v1:*) and rendered article HTML (render:v1:*). A cid is a content
# hash, so entries never go stale — this is what keeps the site warm in
# colos and isolates that have never served it. `caches.default` remains
# the colo-local fast path in front of it. See lib/farfield.ts and
# lib/render-cache.ts.
[[kv_namespaces]]
binding = "CONTENT_CACHE"
id = "d355f4e9f7b8405caddfe8604029be78"

# Let unknown paths fall through to the Worker instead of having the
# asset layer serve 404.html directly. Without this the middleware
# never sees a 404, so agents asking for markdown got the HTML error
# page — the asset layer had already answered. Astro still renders the
# same 404 page for humans; it just does it in the Worker, where
# content negotiation can apply.
[assets]
not_found_handling = "none"
