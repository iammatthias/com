<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#F4EFE4}
html.js,html.js body{overflow:hidden;height:100vh;height:100lvh}
@media (prefers-color-scheme: dark){html,body{background:#15120F}}
/* absolute, not fixed: iOS Safari won't paint fixed content under its floating toolbars, and
   the page never scrolls, so absolute holds still just the same */
canvas{position:absolute;top:0;left:0;z-index:1;display:block;width:100vw;height:100vh;height:100lvh;touch-action:none;outline:none;user-select:none}
/* while the app loads: a line engraving itself, on the paper. The server-rendered page stays in
   the document for agents and no-JS readers, but out of sight whenever scripts run. */
html.js #ssr-root{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
#boot{position:absolute;top:0;left:0;width:100vw;height:100vh;height:100lvh;z-index:2;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#F4EFE4;color:#1B1814;font:15px/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
html.js #boot{display:flex}
html.no-gpu canvas,html.no-gpu #boot,html.no-gpu #diag{display:none!important}
html.no-gpu,html.no-gpu body{overflow:auto!important;height:auto!important}
#boot svg{width:132px;height:132px;overflow:visible}
#boot path{fill:none;stroke:currentColor;stroke-width:1.1;stroke-linecap:round;stroke-dasharray:695;stroke-dashoffset:695;animation:engrave 2.8s cubic-bezier(.45,0,.2,1) infinite}
@keyframes engrave{0%{stroke-dashoffset:695}70%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
#boot .note{color:#665E52;font-size:13px;letter-spacing:.02em}
#boot button{font:inherit;font-size:14px;color:inherit;background:transparent;border:1px solid rgba(21,22,26,.2);border-radius:999px;padding:8px 18px;cursor:pointer;display:none}
#boot.failed path{animation:none;stroke-dashoffset:0;opacity:.35}
#boot.failed button,#boot.slow button{display:block}
@media (prefers-color-scheme: dark){#boot{background:#15120F;color:#F0E9DB}#boot .note{color:#A39A8C}#boot button{border-color:rgba(216,213,202,.25)}}
@media (prefers-reduced-motion: reduce){#boot path{animation:none;stroke-dashoffset:0}}
#diag{position:fixed;left:8px;right:8px;bottom:8px;z-index:9;max-height:40vh;overflow:auto;padding:8px 10px;font:11px/1.4 ui-monospace,Menlo,monospace;color:#fff;background:rgba(120,20,10,.88);border-radius:6px;white-space:pre-wrap;display:none}

<script>
// The engraving needs WebGPU. Without it the page is the plain one: the
// server-rendered page stays in view, and nothing says the engraving failed.
window.__noGpu = !navigator.gpu;
document.documentElement.classList.add(window.__noGpu ? "no-gpu" : "js");
// navigator.gpu can be there with no adapter behind it (headless Chrome, some Linux and
// Safari setups): the engraving can't start, so the page is the plain one after all
if (!window.__noGpu) {
  navigator.gpu.requestAdapter().then(function (a) { return a || Promise.reject(); }).catch(function () {
    window.__noGpu = true;
    document.documentElement.classList.replace("js", "no-gpu");
  });
}
// Safari: every animated frame makes a handful of WebGPU objects (passes, bind groups) whose
// native memory WebKit's collector doesn't weigh, and the JS heap here stays tiny, so it seldom
// collects; the garbage piles up until the tab is killed and reloaded. A short-lived buffer it
// does weigh, every few seconds, prompts the collections that free it.
if (!window.__noGpu && /AppleWebKit/.test(navigator.userAgent) && !/Chrome|Chromium|Edg|Firefox/.test(navigator.userAgent)) {
  setInterval(function () { new Uint8Array(32 << 20)[0] = 1; }, 4000);
}
// The app's files are renamed on every build: a page from before a deploy asks for files that
// are gone, and one caught mid-deploy can ask before they've landed. The boot tries again while
// the line keeps engraving: it fetches the page and the files that failed past the browser's
// cache (a plain reload can be handed back the page it has, and WebKit the failure it kept for a
// preloaded file), then reloads into them, waiting longer each time. The tries are
// counted in sessionStorage, and only a page that draws resets the count, so reloads can't loop.
// Once they're spent the site or the connection is down, and the screen says so.
(function () {
  var WAITS = [1000, 3000, 8000];
  var failed = [];
  // read whole, so the browser's cache keeps it for the reload
  function fresh(url) { return fetch(url, { cache: "reload" }).then(function (r) { return r.arrayBuffer().then(function () { return r.status; }); }); }
  function tries() { try { return Number(sessionStorage.getItem("burin.boot")) || 0; } catch (_) { return WAITS.length; } }
  function note(text, state) {
    var boot = document.getElementById("boot");
    if (!boot) return;
    boot.classList.remove("failed", "slow");
    if (state) boot.classList.add(state);
    boot.querySelector(".note").textContent = text;
  }
  function retry() {
    var n = tries();
    try { if (n >= WAITS.length) throw 0; sessionStorage.setItem("burin.boot", String(n + 1)); } catch (_) {
      window.__reloading = false;
      note("The site didn't answer. The connection may have dropped.", "failed");
      return;
    }
    window.__reloading = true;
    setTimeout(function () {
      Promise.all(failed.map(function (url) { return fresh(url).catch(function () {}); }))
        .then(function () { return fresh(location.href); })
        .then(function (status) {
          if (document.querySelector("canvas")) { window.__reloading = false; window.__booted(); }
          else if (status >= 500) retry();
          else location.reload();
        }, retry);
    }, WAITS[n]);
  }
  window.__fileFailed = function (url) { if (failed.indexOf(url) < 0) failed.push(url); };
  window.__bootFailed = function (msg) {
    if (window.__noGpu) return true;
    if (window.__reloading) return true;
    if (document.querySelector("canvas")) return false;
    if (!/load failed|failed to fetch|networkerror|webassembly|import/i.test(String(msg))) return false;
    retry();
    return true;
  };
  window.__tryAgain = function () {
    try { sessionStorage.removeItem("burin.boot"); } catch (_) {}
    note("engraving…");
    retry();
  };
  window.__booted = function () {
    // a page that drew as its reload was landing is no proof the next one will
    if (!window.__reloading) try { sessionStorage.removeItem("burin.boot"); } catch (_) {}
  };
  window.__slow = function () {
    var boot = document.getElementById("boot");
    if (boot && !boot.classList.contains("failed") && !window.__reloading) note("Still engraving…", "slow");
  };
})();
</script>
<script>
// Startup and GPU failures show on screen (tap to dismiss): phones have no console to read.
(function () {
  var lines = [];
  function show(msg) {
    if (window.__noGpu) return;
    lines.push(String(msg).slice(0, 400));
    var el = document.getElementById("diag");
    if (!el) { el = document.createElement("div"); el.id = "diag"; el.onclick = function () { el.style.display = "none"; }; document.documentElement.appendChild(el); }
    el.textContent = lines.slice(-8).join("\n");
    el.style.display = "block";
  }
  window.__diag = show;
  // an error thrown by someone else's script (the analytics beacon) is theirs, not the app's;
  // the browser reports one from another origin as a bare "Script error." with no file
  function ours(url) { try { return !url || new URL(url).origin === location.origin; } catch (_) { return true; } }
  // a stack that passes through another origin's script: the app never calls into one
  function foreign(stack) { return (String(stack || "").match(/https?:\/\/[^\s/:)]+(:\d+)?/g) || []).some(function (o) { return o !== location.origin; }); }
  addEventListener("error", function (e) { var m = e.message || e.error; if (m !== "Script error." && ours(e.filename) && !window.__bootFailed(m)) show("error: " + m); });
  // a module the app's script imports that's gone (renamed by a deploy) errors on the script
  // element only, which never bubbles: caught on the way down instead (images error here too),
  // with the preloads that failed alongside it. Only the app's own: a blocked third-party script
  // (the analytics beacon) is no boot failure.
  addEventListener("error", function (e) {
    var t = e.target, url = t && (t.src || t.href);
    if (!t || (t.tagName !== "SCRIPT" && t.tagName !== "LINK") || !ours(url)) return;
    if (url) window.__fileFailed(url);
    // the app's boot is an inline module, with no src of its own
    if (t.tagName === "SCRIPT") window.__bootFailed("import failed");
  }, true);
  addEventListener("unhandledrejection", function (e) { var m = e.reason && (e.reason.stack || e.reason.message) || e.reason; if (!foreign(e.reason && e.reason.stack) && !window.__bootFailed(m)) show("rejection: " + m); });
  var ce = console.error;
  console.error = function () { try { if (!foreign(new Error().stack)) show(Array.prototype.join.call(arguments, " ")); } catch (_) {} return ce.apply(console, arguments); };
  var cw = console.warn;
  console.warn = function () { var m = Array.prototype.join.call(arguments, " "); if (/device lost|context lost|out of memory|panicked/i.test(m)) show("warn: " + m); return cw.apply(console, arguments); };
  new MutationObserver(function (_, obs) {
    var c = document.querySelector("canvas");
    if (!c) return;
    obs.disconnect();
    window.__booted();
    // and the line hands over to the plate: fade the loader once the canvas has drawn
    var boot = document.getElementById("boot");
    if (boot) setTimeout(function () {
      boot.style.transition = "opacity .5s ease";
      boot.style.opacity = "0";
      setTimeout(function () { boot.remove(); }, 600);
    }, 250);
  }).observe(document.documentElement, { childList: true, subtree: true });
  setTimeout(function () { if (!document.querySelector("canvas")) window.__slow(); }, 25000);
})();
</script>
